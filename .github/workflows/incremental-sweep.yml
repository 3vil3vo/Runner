name: Auto Sweep & Merge (Incremental - Public Runner)
on:
  schedule:
    - cron: '0 1,5,9,13,17,21 * * *'
  workflow_dispatch:
concurrency:
  group: ovdata-apps-branch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout private code
        uses: actions/checkout@v7
        with:
          repository: 3vil3vo/OV-AppList
          token: ${{ secrets.OV_DATA_PAT }}
          path: code
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          cd code
          npm ci
      - name: Run auto sweep & merge
        env:
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          cd code
          node sweep_auto.js
      - name: Read counts
        id: counts
        run: |
          cd code
          ADDED=$(cat new_apps_count.txt)
          OVERWRITTEN=$(cat overwritten_count.txt)
          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "overwritten=$OVERWRITTEN" >> $GITHUB_OUTPUT
      - name: Commit and push to OV-AppList (main)
        run: |
          cd code
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          git add -A -- AppList.json AppList_part*.json
          if ! git diff --cached --quiet; then
            git commit -m "Add ${{ steps.counts.outputs.added }} apps (${{ steps.counts.outputs.overwritten }} overwritten)"
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs -- AppList.json AppList_part*.json 2>/dev/null || true
              git add -A -- AppList.json AppList_part*.json
              git rebase --continue
            fi
            git push origin HEAD:main
          else
            echo "No changes."
          fi
      - name: Push to OV-Data (apps branch)
        env:
          OV_DATA_PAT: ${{ secrets.OV_DATA_PAT }}
        run: |
          cd code
          git clone --single-branch --branch apps "https://x-access-token:${OV_DATA_PAT}@github.com/3vil3vo/OV-Data.git" ../ovdata
          shopt -s nullglob
          rm -f ../ovdata/AppList.json ../ovdata/AppList_part*.json
          if ls AppList.json AppList_part*.json >/dev/null 2>&1; then
            cp AppList.json ../ovdata/ 2>/dev/null || true
            cp AppList_part*.json ../ovdata/ 2>/dev/null || true
          fi
          cd ../ovdata
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          git add -A -- AppList.json AppList_part*.json
          if ! git diff --cached --quiet; then
            ADDED=$(cat ../code/new_apps_count.txt)
            OVERWRITTEN=$(cat ../code/overwritten_count.txt)
            git commit -m "Add $ADDED apps ($OVERWRITTEN overwritten)"
            git fetch origin apps
            if ! git rebase origin/apps; then
              git checkout --theirs -- AppList.json AppList_part*.json 2>/dev/null || true
              git add -A -- AppList.json AppList_part*.json
              git rebase --continue
            fi
            git push origin HEAD:apps
          else
            echo "No changes."
          fi
