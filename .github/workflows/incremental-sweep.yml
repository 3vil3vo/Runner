name: Auto Sweep & Merge (Incremental - Public Runner)
on:
  schedule:
    - cron: '0 1,5,9,13,17,21 * * *'
  workflow_dispatch:
concurrency:
  group: steam-pics-full-sweep
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout private code
        uses: actions/checkout@v7
        with:
          repository: 3vil3vo/OV-AppList
          token: ${{ secrets.OV_DATA_PAT }}
          path: code

      - name: Checkout OV-Data (main) for PICS tokens
        uses: actions/checkout@v7
        with:
          repository: 3vil3vo/OV-Data
          token: ${{ secrets.OV_DATA_PAT }}
          path: ovdata
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          cd code
          npm ci

      - name: Copy token file from OV-Data to code directory
        run: |
          cp ovdata/pics_access_tokens.json code/

      - name: Run auto sweep & merge
        env:
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          cd code
          node sweep_auto.js

      - name: Validate enrichment coverage
        run: |
          cd code
          if [ ! -f autosweep_coverage.json ]; then
            echo "autosweep_coverage.json missing"
            exit 1
          fi
          FAILED=$(jq -r '.enrichmentFailed // 0' autosweep_coverage.json)
          if [ "$FAILED" -ne 0 ]; then
            echo "Enrichment failed for $FAILED batch(es)"
            exit 1
          fi

      - name: Read counts
        id: counts
        run: |
          cd code
          ADDED=$(cat new_apps_count.txt)
          OVERWRITTEN=$(cat overwritten_count.txt)
          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "overwritten=$OVERWRITTEN" >> $GITHUB_OUTPUT

      - name: Commit and push to OV-AppList (main)
        run: |
          cd code
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          git add -A -- AppList.json AppList_part*.json
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "Auto sweep - added ${{ steps.counts.outputs.added }} apps, overwritten ${{ steps.counts.outputs.overwritten }} - $TIMESTAMP"
            git reset --hard HEAD
            git clean -fd
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent branch update detected. Refusing automatic overwrite."
              exit 1
            fi
            git push origin HEAD:main
          else
            echo "No changes."
          fi

      - name: Push to OV-Data (apps branch)
        env:
          OV_DATA_PAT: ${{ secrets.OV_DATA_PAT }}
        run: |
          cd code
          cd ../ovdata
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin apps
          git checkout apps
          git reset --hard origin/apps
          shopt -s nullglob
          rm -f AppList.json AppList_part*.json
          cp ../code/AppList.json . 2>/dev/null || true
          cp ../code/AppList_part*.json . 2>/dev/null || true
          git add -A -- AppList.json AppList_part*.json
          if ! git diff --cached --quiet; then
            ADDED=$(cat ../code/new_apps_count.txt)
            OVERWRITTEN=$(cat ../code/overwritten_count.txt)
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "Auto sweep (apps branch) - added $ADDED apps, overwritten $OVERWRITTEN - $TIMESTAMP"
            git reset --hard HEAD
            git clean -fd
            git fetch origin apps
            if ! git rebase origin/apps; then
              git rebase --abort || true
              echo "Concurrent branch update detected. Refusing automatic overwrite."
              exit 1
            fi
            git push origin HEAD:apps
          else
            echo "No changes."
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: auto-sweep-diagnostics-${{ github.run_id }}
          path: |
            code/autosweep_coverage.json
            code/new_apps_count.txt
            code/overwritten_count.txt
