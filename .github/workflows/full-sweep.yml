name: Steam PICS Full Sweep

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      refresh_ov_pics:
        description: 'Rebuild OV-PICS files from this completed sweep'
        required: false
        default: false
        type: boolean

      rewrite_ov_pics_history:
        description: 'DANGER: replace OV-PICS main with one fresh snapshot commit'
        required: false
        default: false
        type: boolean

concurrency:
  group: steam-pics-full-sweep
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 1300

    steps:
      - name: Reject unsafe history reset
        shell: bash
        run: |
          if [ "${{ github.event.inputs.rewrite_ov_pics_history }}" = "true" ] && \
             [ "${{ github.event.inputs.refresh_ov_pics }}" != "true" ]; then
            echo "::error::rewrite_ov_pics_history requires refresh_ov_pics=true"
            exit 1
          fi

      - name: Checkout OV-AppList code
        uses: actions/checkout@v7
        with:
          repository: 3vil3vo/OV-AppList
          token: ${{ secrets.OV_DATA_PAT }}
          path: code
          fetch-depth: 0

      - name: Checkout OV-Data main
        uses: actions/checkout@v7
        with:
          repository: 3vil3vo/OV-Data
          token: ${{ secrets.OV_DATA_PAT }}
          path: ovdata
          ref: main
          fetch-depth: 1

      - name: Checkout OV-PICS
        uses: actions/checkout@v7
        with:
          repository: 3vil3vo/OV-PICS
          token: ${{ secrets.OV_DATA_PAT }}
          path: ovpics
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          cd code
          npm ci

      - name: Copy PICS access tokens
        shell: bash
        run: |
          cp ovdata/pics_access_tokens.json code/pics_access_tokens.json

      - name: Run validated full PICS sweep
        shell: bash
        env:
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_REFRESH_TOKENS: ${{ secrets.STEAM_REFRESH_TOKENS }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          REFRESH_OV_PICS: ${{ github.event.inputs.refresh_ov_pics == 'true' && '1' || '0' }}
        run: |
          cd code
          node sweep_full_daily.js

      - name: Read sweep metadata
        id: sweep
        if: always()
        shell: bash
        run: |
          cd code

          if [ -f merge_counts.json ]; then
            echo "added=$(jq -r '.added // 0' merge_counts.json)" >> "$GITHUB_OUTPUT"
            echo "overwritten=$(jq -r '.overwritten // 0' merge_counts.json)" >> "$GITHUB_OUTPUT"
          else
            echo "added=0" >> "$GITHUB_OUTPUT"
            echo "overwritten=0" >> "$GITHUB_OUTPUT"
          fi

          if [ -f ovpics_manifest.json ]; then
            echo "responses=$(jq -r '.responseCount // 0' ovpics_manifest.json)" >> "$GITHUB_OUTPUT"
            echo "coverage=$(jq -r '.coverage.completedBatches // 0' ovpics_manifest.json)" >> "$GITHUB_OUTPUT"
          else
            echo "responses=0" >> "$GITHUB_OUTPUT"
            echo "coverage=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pics-sweep-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            code/coverage.json
            code/failed_batches.json
            code/ovpics_manifest.json
            code/merge_counts.json
            code/*.log

      - name: Publish OV-PICS normal snapshot
        if: success() && github.event.inputs.rewrite_ov_pics_history != 'true'
        shell: bash
        run: |
          cd ovpics

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No OV-PICS changes to publish."
            exit 0
          fi

          TIMESTAMP="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git commit -m "Full PICS sweep - validated raw snapshot - ${TIMESTAMP}"

          git fetch origin main

          if ! git rebase origin/main; then
            echo "::error::OV-PICS changed during this run. Refusing automatic conflict resolution."
            echo "::error::Rerun the validated sweep so it is built from the latest OV-PICS main."
            git rebase --abort || true
            exit 1
          fi

          git push origin HEAD:main

      - name: Replace OV-PICS history with fresh snapshot
        if: success() && github.event.inputs.rewrite_ov_pics_history == 'true'
        shell: bash
        run: |
          cd ovpics

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          test -f manifest.json
          test -f coverage.json
          test "$(jq -r '.complete' manifest.json)" = "true"
          test "$(jq -r '.coverage.failedBatches' manifest.json)" -eq 0
          test "$(jq -r '.failedBatches' coverage.json)" -eq 0
          test "$(jq -r '.completedBatches' coverage.json)" -eq "$(jq -r '.totalBatches' coverage.json)"

          git checkout --orphan fresh-pics-snapshot
          git reset

          git add -A
          test -n "$(git status --porcelain)"

          TIMESTAMP="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git commit -m "Fresh validated OV-PICS snapshot - ${TIMESTAMP}"

          git push --force origin HEAD:main

      - name: Publish OV-AppList main
        if: success()
        shell: bash
        run: |
          cd code

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          FILES=(AppList.json AppList_part*.json)

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No AppList output files found."
            exit 0
          fi

          git add -A -- AppList.json AppList_part*.json

          if git diff --cached --quiet; then
            echo "No AppList changes to publish."
            exit 0
          fi

          TIMESTAMP="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git commit -m "AppList update - added ${{ steps.sweep.outputs.added }}, overwritten ${{ steps.sweep.outputs.overwritten }} - ${TIMESTAMP}"

          git clean -fd
          git fetch origin main

          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::OV-AppList changed during this run; refusing automatic overwrite."
            exit 1
          fi

          git push origin HEAD:main

      - name: Publish OV-Data apps branch
        if: success()
        shell: bash
        env:
          OV_DATA_PAT: ${{ secrets.OV_DATA_PAT }}
        run: |
          cd code

          git clone \
            --single-branch \
            --branch apps \
            "https://x-access-token:${OV_DATA_PAT}@github.com/3vil3vo/OV-Data.git" \
            ../ovdata_apps

          shopt -s nullglob
          rm -f ../ovdata_apps/AppList.json ../ovdata_apps/AppList_part*.json
          cp AppList.json ../ovdata_apps/ 2>/dev/null || true
          cp AppList_part*.json ../ovdata_apps/ 2>/dev/null || true

          cd ../ovdata_apps

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A -- AppList.json AppList_part*.json

          if git diff --cached --quiet; then
            echo "No OV-Data apps-branch changes to publish."
            exit 0
          fi

          TIMESTAMP="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git commit -m "AppList update - added ${{ steps.sweep.outputs.added }}, overwritten ${{ steps.sweep.outputs.overwritten }} - ${TIMESTAMP}"

          git fetch origin apps

          if ! git rebase origin/apps; then
            git rebase --abort || true
            echo "::error::OV-Data apps branch changed during this run."
            exit 1
          fi

          git push origin HEAD:apps