name: Fetch
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      session_count:
        description: 'Number of anonymous Steam sessions for verification'
        required: false
        default: '10'
      concurrent_per_session:
        description: 'Concurrent manifest downloads per verification session'
        required: false
        default: '10'
      batch_size:
        description: 'Depots per download-then-decrypt verification batch'
        required: false
        default: '2000'
      debug_logging:
        description: 'Verbose per-ID debug logging'
        required: false
        type: boolean
        default: false
concurrency:
  group: depot-mapping
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout private OV-DataSuite
        uses: actions/checkout@v7
        with:
          repository: 3vil3vo/OV-DataSuite
          token: ${{ secrets.OV_DATA_PAT }}
          path: OV-DataSuite
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: OV-DataSuite/scripts/package-lock.json

      - name: Install dependencies
        working-directory: OV-DataSuite/scripts
        run: npm ci

      - name: Clone OV-PICS and validate snapshot
        env:
          OV_DATA_PAT: ${{ secrets.OV_DATA_PAT }}
        run: |
          git clone -q --depth=1 "https://${OV_DATA_PAT}@github.com/3vil3vo/OV-PICS.git" OV-DataSuite/ov-pics-clone
          cd OV-DataSuite/ov-pics-clone
          test -f manifest.json
          test -f coverage.json
          test "$(jq -r '.complete' manifest.json)" = "true"
          test "$(jq -r '.coverage.failedBatches' manifest.json)" = "0"
          test "$(jq -r '.failedBatches' coverage.json)" = "0"
          test "$(jq -r '.completedBatches' coverage.json)" = "$(jq -r '.totalBatches' coverage.json)"

      - name: Run fetch pipeline
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          OV_DATA_PAT: ${{ secrets.OV_DATA_PAT }}
          GH_PAT_DATA_REPOS: ${{ secrets.OV_DATA_PAT }}
          ANON_SESSION_COUNT: ${{ github.event.inputs.session_count || '10' }}
          CONCURRENT_DOWNLOADS_PER_SESSION: ${{ github.event.inputs.concurrent_per_session || '10' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '2000' }}
          DEBUG_LOGGING: ${{ github.event.inputs.debug_logging || 'false' }}
          OV_PICS_CLONE_DIR: ov-pics-clone
          MAX_RUNTIME_MS: '18000000'
          NODE_OPTIONS: '--max-old-space-size=6144'
        working-directory: OV-DataSuite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${DEBUG_LOGGING}" == "true" ]; then
            set -x
          fi
          node scripts/fetch.js

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-diagnostics-${{ github.run_id }}
          path: |
            OV-DataSuite/run_summary.json
            OV-DataSuite/output_data/changelog.md
            OV-DataSuite/*.log

      - name: Commit and push local outputs
        if: success()
        working-directory: OV-DataSuite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PATHS=()
          [ -f input_data/depot_keys.json ] && PATHS+=(input_data/depot_keys.json)
          [ -f input_data/pics_access_tokens.json ] && PATHS+=(input_data/pics_access_tokens.json)
          [ -f input_data/AppList.json ] && PATHS+=(input_data/AppList.json)
          [ -f output_data/blacklist.json ] && PATHS+=(output_data/blacklist.json)
          [ -f output_data/flagged.json ] && PATHS+=(output_data/flagged.json)
          [ -f output_data/changelog.md ] && PATHS+=(output_data/changelog.md)
          [ -f output_data/app_ids_in_depot_keys.json ] && PATHS+=(output_data/app_ids_in_depot_keys.json)
          [ -f output_data/unmapped_depot_ids.json ] && PATHS+=(output_data/unmapped_depot_ids.json)
          [ -d cache ] && PATHS+=(cache)
          if [ ${#PATHS[@]} -eq 0 ]; then
            exit 0
          fi
          find cache -name "*.tmp" -delete 2>/dev/null
          git add -A -- "${PATHS[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "chore: fetch run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              exit 1
            fi
            git push -q origin HEAD:main
          fi

      - name: Commit and push depot keys and tokens to OV-Data
        if: success()
        env:
          OV_DATA_PAT: ${{ secrets.OV_DATA_PAT }}
        working-directory: OV-DataSuite
        run: |
          git clone -q "https://${OV_DATA_PAT}@github.com/3vil3vo/OV-Data.git" ov-data-clone
          cp input_data/depot_keys.json ov-data-clone/depot_keys.json
          cp input_data/pics_access_tokens.json ov-data-clone/pics_access_tokens.json
          cd ov-data-clone
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ADDED=$(jq -r '.newIdsCount // 0' ../run_summary.json 2>/dev/null || echo "0")
          TOKENS=$(jq -r '.tokensAdded // 0' ../run_summary.json 2>/dev/null || echo "0")
          INVALID=$(jq -r '.invalidCount // 0' ../run_summary.json 2>/dev/null || echo "0")
          DEPOT_COUNT=$(jq -r '.finalDepotCount // length' ../run_summary.json 2>/dev/null || jq 'length' depot_keys.json)
          TOKEN_COUNT=$(jq -r '.finalTokenCount // ((.Apps | length // 0) + (.Packages | length // 0))' ../run_summary.json 2>/dev/null || jq '((.Apps | length // 0) + (.Packages | length // 0))' pics_access_tokens.json)
          git add depot_keys.json pics_access_tokens.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: +${ADDED} keys, +${TOKENS} tokens, -${INVALID} invalid keys -> now ${DEPOT_COUNT} keys, ${TOKEN_COUNT} tokens"
            git fetch origin main 2>/dev/null || true
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              if ! git rebase --autostash origin/main; then
                git rebase --abort || true
                exit 1
              fi
            fi
            git push -q origin HEAD:main
          fi

      - name: Write job summary
        if: success()
        working-directory: OV-DataSuite
        run: |
          {
            echo "### OV-DataSuite Fetch Summary"
            echo ""
            if [ -f run_summary.md ]; then
              cat run_summary.md
            else
              echo "No summary available."
            fi
            echo ""
            echo "PICS archive validated from OV-PICS manifest."
          } >> "$GITHUB_STEP_SUMMARY"
